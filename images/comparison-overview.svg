<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Whiplash comparison overview</title>
  <desc id="desc">A portfolio illustration of a same-song comparison with mapped timing, tonal change, and review regions. It contains no private audio or exact evaluation data.</desc>
  <rect width="1200" height="675" fill="#0d1012"/>
  <circle cx="1070" cy="-20" r="285" fill="#2b2029" opacity="0.72"/>
  <text x="62" y="62" fill="#efb366" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">WHIPLASH / SANITIZED PROTOTYPE VIEW</text>
  <text x="62" y="116" fill="#f5f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Compare performances in musical time</text>
  <text x="62" y="151" fill="#a7aba7" font-family="Segoe UI, Arial, sans-serif" font-size="19">Reference mix  /  alternate full-mix performance</text>

  <rect x="62" y="190" width="1076" height="128" rx="18" fill="#171b1e" stroke="#363d40"/>
  <rect x="90" y="220" width="126" height="38" rx="19" fill="#163525" stroke="#92d6a4"/>
  <text x="153" y="245" text-anchor="middle" fill="#92d6a4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SAME SONG</text>
  <text x="244" y="245" fill="#f5f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Musical correspondence retained</text>
  <text x="90" y="289" fill="#a7aba7" font-family="Segoe UI, Arial, sans-serif" font-size="16">The alternate performance can move in tempo and production while remaining mapped to the reference.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(62 358)">
      <rect width="330" height="164" rx="16" fill="#171b1e" stroke="#363d40"/>
      <text x="24" y="39" fill="#efb366" font-size="14" font-weight="700" letter-spacing="2">TIMING</text>
      <text x="24" y="79" fill="#f5f2ea" font-size="24" font-weight="700">Performance mapped</text>
      <text x="24" y="112" fill="#a7aba7" font-size="15">Follow corresponding musical moments</text>
      <text x="24" y="136" fill="#a7aba7" font-size="15">through natural tempo movement.</text>
    </g>
    <g transform="translate(435 358)">
      <rect width="330" height="164" rx="16" fill="#171b1e" stroke="#363d40"/>
      <text x="24" y="39" fill="#efb366" font-size="14" font-weight="700" letter-spacing="2">CHANGE</text>
      <text x="24" y="79" fill="#f5f2ea" font-size="24" font-weight="700">Evidence summarized</text>
      <text x="24" y="112" fill="#a7aba7" font-size="15">Separate broad level, tonal balance,</text>
      <text x="24" y="136" fill="#a7aba7" font-size="15">and structural observations.</text>
    </g>
    <g transform="translate(808 358)">
      <rect width="330" height="164" rx="16" fill="#1b2d23" stroke="#92d6a4"/>
      <text x="24" y="39" fill="#92d6a4" font-size="14" font-weight="700" letter-spacing="2">REVIEW</text>
      <text x="24" y="79" fill="#f5f2ea" font-size="24" font-weight="700">A/B regions ready</text>
      <text x="24" y="112" fill="#c8c7c2" font-size="15">Jump directly to likely differences</text>
      <text x="24" y="136" fill="#c8c7c2" font-size="15">and let the musician decide.</text>
    </g>
  </g>

  <rect x="62" y="562" width="1076" height="62" rx="12" fill="#171b1e"/>
  <text x="88" y="589" fill="#f5f2ea" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Explainable by design</text>
  <text x="88" y="609" fill="#a7aba7" font-family="Segoe UI, Arial, sans-serif" font-size="14">Whiplash reports uncertainty and avoids inventing a specific instrument, performer, or production cause.</text>
  <text x="1112" y="597" text-anchor="end" fill="#6f7779" font-family="Segoe UI, Arial, sans-serif" font-size="12">Portfolio illustration · no private audio or exact metrics</text>
</svg>

